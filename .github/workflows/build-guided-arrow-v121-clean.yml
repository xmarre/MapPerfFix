name: Build Guided Arrow v1.2.1 Clean

on:
  push:
    branches:
      - ci/guided-arrow-v1.2.1-clean
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SOURCE_B64: ci/input/GuidedArrow.Progression.BuildSource.zip.b64
      SOURCE_ZIP: work/transport/GuidedArrow.Progression.BuildSource.v4.zip
      SOURCE_SHA256: 3568dc461a4b045d5e04dbfa84bae38deff49e7c4222857e69e7eb65cf4661a7
      PATCH_SHA256: f19188632bc913e6136a1434b373f65e917793418918a2b5d0f393d1bf973577

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify exact v1.2.0 hotfix source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path work/transport, work/source, artifacts | Out-Null
          [System.IO.File]::WriteAllBytes($env:SOURCE_ZIP, [Convert]::FromBase64String([System.IO.File]::ReadAllText($env:SOURCE_B64)))
          $actual = (Get-FileHash $env:SOURCE_ZIP -Algorithm SHA256).Hash.ToLowerInvariant()
          "Base source SHA-256: $actual" | Tee-Object -FilePath artifacts/build.log
          if ($actual -ne $env:SOURCE_SHA256) { throw "Base source SHA-256 mismatch. Expected $env:SOURCE_SHA256, got $actual" }
          Expand-Archive -LiteralPath $env:SOURCE_ZIP -DestinationPath work/source -Force
      - name: Apply reviewed v1.2.1 source patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patch = @'
diff --git a/GuidedArrow.Progression/Source/CharacterScreenButton.cs b/GuidedArrow.Progression/Source/CharacterScreenButton.cs
new file mode 100644
index 0000000..87188f7
--- /dev/null
+++ b/GuidedArrow.Progression/Source/CharacterScreenButton.cs
@@ -0,0 +1,91 @@
+using System;
+using TaleWorlds.Engine.GauntletUI;
+using TaleWorlds.GauntletUI.Data;
+using TaleWorlds.Library;
+using TaleWorlds.ScreenSystem;
+
+namespace GuidedArrow.Progression
+{
+    internal sealed class CharacterScreenButtonVM : ViewModel
+    {
+        [DataSourceProperty]
+        public string ButtonText => "Guided Arrow Mastery";
+
+        public void ExecuteOpenMastery()
+        {
+            SubModule.OpenScreen();
+        }
+    }
+
+    internal sealed class CharacterScreenButtonController
+    {
+        private ScreenBase _screen;
+        private GauntletLayer _layer;
+        private GauntletMovieIdentifier _movie;
+        private CharacterScreenButtonVM _dataSource;
+
+        internal void Tick()
+        {
+            ScreenBase top = ScreenManager.TopScreen;
+            bool shouldShow = top != null && IsCharacterDeveloperScreen(top);
+
+            if (!shouldShow)
+            {
+                Detach();
+                return;
+            }
+
+            if (ReferenceEquals(_screen, top) && _layer != null) return;
+            Detach();
+            Attach(top);
+        }
+
+        internal void Detach()
+        {
+            try
+            {
+                if (_layer != null && _movie != null) _layer.ReleaseMovie(_movie);
+            }
+            catch { }
+
+            try
+            {
+                if (_dataSource != null) _dataSource.OnFinalize();
+            }
+            catch { }
+
+            try
+            {
+                if (_screen != null && _layer != null) _screen.RemoveLayer(_layer);
+            }
+            catch { }
+
+            _movie = null;
+            _dataSource = null;
+            _layer = null;
+            _screen = null;
+        }
+
+        private void Attach(ScreenBase screen)
+        {
+            try
+            {
+                _screen = screen;
+                _dataSource = new CharacterScreenButtonVM();
+                _layer = new GauntletLayer("GuidedArrowCharacterButton", 220);
+                _screen.AddLayer(_layer);
+                _movie = _layer.LoadMovie("GuidedArrowCharacterButton", _dataSource);
+            }
+            catch
+            {
+                Detach();
+            }
+        }
+
+        private static bool IsCharacterDeveloperScreen(ScreenBase screen)
+        {
+            string name = screen.GetType().Name;
+            return name.IndexOf("CharacterDeveloperScreen", StringComparison.OrdinalIgnoreCase) >= 0;
+        }
+    }
+}
