'@
          [System.IO.File]::WriteAllText('work/v121.patch', $patch, [System.Text.UTF8Encoding]::new($false))
          $actualPatch = (Get-FileHash 'work/v121.patch' -Algorithm SHA256).Hash.ToLowerInvariant()
          "Patch SHA-256: $actualPatch" | Tee-Object -FilePath artifacts/build.log -Append
          if ($actualPatch -ne $env:PATCH_SHA256) { throw "Patch SHA-256 mismatch. Expected $env:PATCH_SHA256, got $actualPatch" }
          git apply --directory=work/source --whitespace=nowarn work/v121.patch
          if ($LASTEXITCODE -ne 0) { throw 'v1.2.1 source patch failed to apply' }
          Get-ChildItem -Recurse work/source/GuidedArrow.Progression/Source -File | Sort-Object FullName | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.FullName.Substring((Resolve-Path work/source).Path.Length + 1))"
          } | Set-Content artifacts/source-manifest.sha256
      - name: Restore and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = 'work/source/GuidedArrow.Progression/Source/GuidedArrow.Progression.csproj'
          dotnet restore $project *>&1 | Tee-Object -FilePath artifacts/build.log -Append
          dotnet build $project -c Release --no-restore -o artifacts /p:ContinuousIntegrationBuild=true *>&1 | Tee-Object -FilePath artifacts/build.log -Append
          if (-not (Test-Path 'artifacts/GuidedArrow.Progression.dll')) { throw 'GuidedArrow.Progression.dll was not produced' }
          Get-FileHash artifacts/GuidedArrow.Progression.dll -Algorithm SHA256 | Format-List | Out-String | Tee-Object -FilePath artifacts/build.log -Append
      - name: Upload compiled build
        uses: actions/upload-artifact@v4
        with:
          name: GuidedArrow.Progression-v1.2.1-clean-bin
          path: artifacts
          if-no-files-found: error
          retention-days: 7
