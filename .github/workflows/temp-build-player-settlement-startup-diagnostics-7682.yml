name: Temporary Player Settlement Startup Diagnostics 7.6.8.2 Build

on:
  pull_request:
    branches: [master]
    paths:
      - '_ps_startup_diag_7682/**'
      - '.github/workflows/temp-build-player-settlement-startup-diagnostics-7682.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        shell: pwsh
        run: dotnet restore _ps_startup_diag_7682/PlayerSettlementStartupDiagnostics.csproj
      - name: Build
        shell: pwsh
        run: dotnet build _ps_startup_diag_7682/PlayerSettlementStartupDiagnostics.csproj -c Release --no-restore
      - name: Validate assembly
        shell: pwsh
        run: |
          $dll = '_ps_startup_diag_7682/bin/Release/net472/PlayerSettlementStartupDiagnostics.dll'
          if (-not (Test-Path $dll)) { throw 'Diagnostic DLL was not produced.' }
          $version = [Reflection.AssemblyName]::GetAssemblyName($dll).Version.ToString()
          if ($version -ne '7.6.8.2') { throw "Unexpected assembly version: $version" }
          $hash = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          AssemblyVersion=$version
          DLL_SHA256=$hash
          Target=Bannerlord 1.3.15 / Player Settlement 7.6.8.1
          Behavior=Named startup boundaries and full Exception.ToString logging only; exceptions are rethrown unchanged
          "@ | Set-Content -Encoding UTF8 _ps_startup_diag_7682/BUILD_INFO.txt
      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item _ps_startup_diag_7682/bin/Release/net472/PlayerSettlementStartupDiagnostics.dll artifact/
          Copy-Item _ps_startup_diag_7682/bin/Release/net472/PlayerSettlementStartupDiagnostics.pdb artifact/
          Copy-Item _ps_startup_diag_7682/PlayerSettlementStartupDiagnostics.cs artifact/
          Copy-Item _ps_startup_diag_7682/PlayerSettlementStartupDiagnostics.csproj artifact/
          Copy-Item _ps_startup_diag_7682/BUILD_INFO.txt artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: PlayerSettlementStartupDiagnostics-7.6.8.2
          path: artifact/*
          if-no-files-found: error
          retention-days: 1
