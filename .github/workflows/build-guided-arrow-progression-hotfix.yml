name: Build Guided Arrow Progression v1.2.1 MCM Character Button

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SOURCE_PARTS: ci/input/guided-arrow-v121
      SOURCE_ZIP: work/transport/GuidedArrow.Progression.BuildSource.zip
      SOURCE_SHA256: 86ca015a61ed550ac97a392a7a15fb75ad318ccf063515ed4c1af2371fd32d80

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Reassemble and verify exact source archive
        id: source
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path work/transport, work/source, artifacts | Out-Null
          $partFiles = @(Get-ChildItem -LiteralPath $env:SOURCE_PARTS -Filter 'part*.b64' | Sort-Object Name)
          "Part count: $($partFiles.Count)" | Tee-Object -FilePath artifacts/source-integrity.txt
          $partFiles | ForEach-Object { "Part: $($_.Name) Length=$((Get-Item $_.FullName).Length)" } | Tee-Object -FilePath artifacts/source-integrity.txt -Append
          if ($partFiles.Count -ne 5) { throw "Expected 5 source parts, found $($partFiles.Count)" }
          $segments = @($partFiles | ForEach-Object { [System.IO.File]::ReadAllText($_.FullName) })
          $base64 = $segments -join ''
          "Combined Base64 length: $($base64.Length)" | Tee-Object -FilePath artifacts/source-integrity.txt -Append
          [System.IO.File]::WriteAllBytes($env:SOURCE_ZIP, [Convert]::FromBase64String($base64))
          $actual = (Get-FileHash $env:SOURCE_ZIP -Algorithm SHA256).Hash.ToLowerInvariant()
          "Expected source SHA-256: $env:SOURCE_SHA256" | Tee-Object -FilePath artifacts/source-integrity.txt -Append
          "Actual source SHA-256:   $actual" | Tee-Object -FilePath artifacts/source-integrity.txt -Append
          if ($actual -ne $env:SOURCE_SHA256) { throw "Source SHA-256 mismatch. Expected $env:SOURCE_SHA256, got $actual" }
          Expand-Archive -LiteralPath $env:SOURCE_ZIP -DestinationPath work/source -Force
      - name: Upload source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GuidedArrow-v1.2.1-source-integrity
          path: artifacts/source-integrity.txt
          if-no-files-found: error
          retention-days: 7
      - name: Stop on source failure
        if: steps.source.outcome != 'success'
        shell: pwsh
        run: throw 'Source reassembly or integrity verification failed.'
      - name: Restore and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = 'work/source/GuidedArrow.Progression/Source/GuidedArrow.Progression.csproj'
          dotnet restore $project *>&1 | Tee-Object -FilePath artifacts/build.log -Append
          dotnet build $project -c Release --no-restore -o artifacts /p:ContinuousIntegrationBuild=true *>&1 | Tee-Object -FilePath artifacts/build.log -Append
          if (-not (Test-Path 'artifacts/GuidedArrow.Progression.dll')) { throw 'GuidedArrow.Progression.dll was not produced' }
          Get-FileHash artifacts/GuidedArrow.Progression.dll -Algorithm SHA256 | Format-List | Out-String | Tee-Object -FilePath artifacts/build.log -Append
      - name: Upload compiled build
        uses: actions/upload-artifact@v4
        with:
          name: GuidedArrow.Progression-v1.2.1-mcm-character-button-bin
          path: artifacts
          if-no-files-found: error
          retention-days: 7
