name: Temporary Player Settlement Village Raid Fix 7.6.8 Build

on:
  pull_request:
    branches: [master]
    paths:
      - '_ps_village_raid_fix_768/**'
      - '.github/workflows/temp-build-player-settlement-village-raid-fix-768.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        shell: pwsh
        run: dotnet restore _ps_village_raid_fix_768/PlayerSettlementVillageRaidFix.csproj
      - name: Build
        shell: pwsh
        run: dotnet build _ps_village_raid_fix_768/PlayerSettlementVillageRaidFix.csproj -c Release --no-restore
      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item _ps_village_raid_fix_768/bin/Release/net472/PlayerSettlementVillageRaidFix.dll artifact/
          Copy-Item _ps_village_raid_fix_768/bin/Release/net472/PlayerSettlementVillageRaidFix.pdb artifact/
          Copy-Item _ps_village_raid_fix_768/PlayerSettlementVillageRaidFix.cs artifact/
          Copy-Item _ps_village_raid_fix_768/PlayerSettlementVillageRaidFix.csproj artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: PlayerSettlementVillageRaidFix-7.6.8
          path: artifact/*
          if-no-files-found: error
          retention-days: 1
