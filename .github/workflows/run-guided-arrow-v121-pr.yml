name: Run Guided Arrow v1.2.1 Clean PR Build

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SOURCE_B64: ci/input/GuidedArrow.Progression.BuildSource.zip.b64
      SOURCE_ZIP: work/transport/GuidedArrow.Progression.BuildSource.v4.zip
      SOURCE_SHA256: 3568dc461a4b045d5e04dbfa84bae38deff49e7c4222857e69e7eb65cf4661a7
      PATCH_SHA256: f19188632bc913e6136a1434b373f65e917793418918a2b5d0f393d1bf973577

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify base source and extract reviewed patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path work/transport, work/source, artifacts | Out-Null
          [System.IO.File]::WriteAllBytes($env:SOURCE_ZIP, [Convert]::FromBase64String([System.IO.File]::ReadAllText($env:SOURCE_B64)))
          $sourceHash = (Get-FileHash $env:SOURCE_ZIP -Algorithm SHA256).Hash.ToLowerInvariant()
          "Base source SHA-256: $sourceHash" | Tee-Object -FilePath artifacts/build.log
          if ($sourceHash -ne $env:SOURCE_SHA256) { throw "Base source SHA-256 mismatch. Expected $env:SOURCE_SHA256, got $sourceHash" }
          Expand-Archive -LiteralPath $env:SOURCE_ZIP -DestinationPath work/source -Force

          $workflowText = [System.IO.File]::ReadAllText('.github/workflows/build-guided-arrow-v121-clean.yml')
          $match = [regex]::Match($workflowText, "(?s)\$patch = @'\r?\n(.*?)\r?\n'@")
          if (-not $match.Success) { throw 'Could not extract reviewed v1.2.1 patch from workflow.' }
          $patch = ($match.Groups[1].Value -replace "`r`n", "`n") + "`n"
          [System.IO.File]::WriteAllText('work/v121.patch', $patch, [System.Text.UTF8Encoding]::new($false))
          $patchHash = (Get-FileHash 'work/v121.patch' -Algorithm SHA256).Hash.ToLowerInvariant()
          "Patch SHA-256: $patchHash" | Tee-Object -FilePath artifacts/build.log -Append
          if ($patchHash -ne $env:PATCH_SHA256) { throw "Patch SHA-256 mismatch. Expected $env:PATCH_SHA256, got $patchHash" }
          git apply --directory=work/source --whitespace=nowarn work/v121.patch
          if ($LASTEXITCODE -ne 0) { throw 'v1.2.1 source patch failed to apply' }
          Get-ChildItem -Recurse work/source/GuidedArrow.Progression/Source -File | Sort-Object FullName | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.FullName.Substring((Resolve-Path work/source).Path.Length + 1))"
          } | Set-Content artifacts/source-manifest.sha256
      - name: Restore and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = 'work/source/GuidedArrow.Progression/Source/GuidedArrow.Progression.csproj'
          dotnet restore $project *>&1 | Tee-Object -FilePath artifacts/build.log -Append
          dotnet build $project -c Release --no-restore -o artifacts /p:ContinuousIntegrationBuild=true *>&1 | Tee-Object -FilePath artifacts/build.log -Append
          if (-not (Test-Path 'artifacts/GuidedArrow.Progression.dll')) { throw 'GuidedArrow.Progression.dll was not produced' }
          Get-FileHash artifacts/GuidedArrow.Progression.dll -Algorithm SHA256 | Format-List | Out-String | Tee-Object -FilePath artifacts/build.log -Append
      - name: Upload compiled build
        uses: actions/upload-artifact@v4
        with:
          name: GuidedArrow.Progression-v1.2.1-clean-bin
          path: artifacts
          if-no-files-found: error
          retention-days: 7
